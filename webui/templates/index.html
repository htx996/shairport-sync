<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <script>
    (() => {
      const key = "airplay-panel-theme";
      const storedValue = localStorage.getItem(key) || "system";
      const value = ["light", "dark", "system"].includes(storedValue) ? storedValue : "system";
      document.documentElement.dataset.themePreference = value;
      if (value === "light" || value === "dark") {
        document.documentElement.dataset.theme = value;
      }
      document.documentElement.dataset.resolvedTheme = value === "system"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : value;
    })();
  </script>
  <title>Shairport Sync</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #EAF1FB;
      --bg2: #F7FAFF;
      --label: #050506;
      --secondary: rgba(60, 60, 67, 0.72);
      --tertiary: rgba(60, 60, 67, 0.38);
      --separator: rgba(60, 60, 67, 0.20);
      --glass: rgba(255, 255, 255, 0.24);
      --glass-strong: rgba(255, 255, 255, 0.32);
      --glass-heavy: rgba(255, 255, 255, 0.44);
      --glass-control: rgba(255, 255, 255, 0.16);
      --fill: rgba(120, 120, 128, 0.08);
      --fill-strong: rgba(120, 120, 128, 0.13);
      --edge: rgba(255, 255, 255, 0.42);
      --inner-edge: rgba(255, 255, 255, 0.55);
      --shadow: rgba(31, 35, 46, 0.09);
      --shadow-soft: rgba(31, 35, 46, 0.05);
      --blue: #007AFF;
      --blue2: #0A84FF;
      --green: #34C759;
      --orange: #FF9500;
      --red: #FF3B30;
      --purple: #AF52DE;
      --ring: rgba(0, 122, 255, 0.34);
      --radius-card: 26px;
      --radius-inner: 16px;
      --page-max: 1240px;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-spring: cubic-bezier(0.18, 1.28, 0.32, 1);
      --nav-h: 68px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
      font-optical-sizing: auto;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg: #05060A;
        --bg2: #0B0F16;
        --label: #FFFFFF;
        --secondary: rgba(235, 235, 245, 0.68);
        --tertiary: rgba(235, 235, 245, 0.38);
        --separator: rgba(84, 84, 88, 0.58);
        --glass: rgba(24, 27, 33, 0.28);
        --glass-strong: rgba(34, 38, 46, 0.40);
        --glass-heavy: rgba(42, 46, 55, 0.48);
        --glass-control: rgba(255, 255, 255, 0.04);
        --fill: rgba(118, 118, 128, 0.13);
        --fill-strong: rgba(118, 118, 128, 0.18);
        --edge: rgba(255, 255, 255, 0.16);
        --inner-edge: rgba(255, 255, 255, 0.18);
        --shadow: rgba(0, 0, 0, 0.34);
        --shadow-soft: rgba(0, 0, 0, 0.20);
        --ring: rgba(10, 132, 255, 0.44);
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #05060A;
      --bg2: #0B0F16;
      --label: #FFFFFF;
      --secondary: rgba(235, 235, 245, 0.68);
      --tertiary: rgba(235, 235, 245, 0.38);
      --separator: rgba(84, 84, 88, 0.58);
      --glass: rgba(24, 27, 33, 0.28);
      --glass-strong: rgba(34, 38, 46, 0.40);
      --glass-heavy: rgba(42, 46, 55, 0.48);
      --glass-control: rgba(255, 255, 255, 0.04);
      --fill: rgba(118, 118, 128, 0.13);
      --fill-strong: rgba(118, 118, 128, 0.18);
      --edge: rgba(255, 255, 255, 0.16);
      --inner-edge: rgba(255, 255, 255, 0.18);
      --shadow: rgba(0, 0, 0, 0.34);
      --shadow-soft: rgba(0, 0, 0, 0.20);
      --ring: rgba(10, 132, 255, 0.44);
    }

    :root[data-theme="light"] {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--label);
      background:
        radial-gradient(1200px 720px at 10% 8%, rgba(10, 132, 255, 0.22), transparent 62%),
        radial-gradient(1050px 700px at 88% 0%, rgba(52, 199, 89, 0.15), transparent 62%),
        radial-gradient(980px 640px at 52% 100%, rgba(94, 92, 230, 0.10), transparent 68%),
        radial-gradient(900px 620px at 90% 92%, rgba(255, 45, 85, 0.10), transparent 68%),
        linear-gradient(180deg, var(--bg2), var(--bg));
      overflow-x: hidden;
      transition:
        color 220ms ease,
        background-color 220ms ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(115deg, rgba(255, 255, 255, 0.44), rgba(255, 255, 255, 0.04) 42%, rgba(255, 255, 255, 0.18)),
        radial-gradient(720px 500px at 48% 16%, rgba(255, 255, 255, 0.24), transparent 68%);
    }

    :root[data-theme="dark"] body {
      background:
        radial-gradient(1120px 780px at 9% 5%, rgba(10, 55, 130, 0.36), transparent 63%),
        radial-gradient(980px 700px at 86% 2%, rgba(38, 114, 61, 0.20), transparent 62%),
        radial-gradient(860px 660px at 90% 96%, rgba(94, 92, 230, 0.16), transparent 68%),
        linear-gradient(180deg, var(--bg2), var(--bg));
    }

    :root[data-theme="dark"] body::before {
      background:
        linear-gradient(115deg, rgba(255, 255, 255, 0.07), rgba(0, 0, 0, 0.18) 42%, rgba(255, 255, 255, 0.04)),
        radial-gradient(760px 520px at 48% 16%, rgba(255, 255, 255, 0.04), transparent 68%);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) body {
        background:
          radial-gradient(1120px 780px at 9% 5%, rgba(10, 55, 130, 0.36), transparent 63%),
          radial-gradient(980px 700px at 86% 2%, rgba(38, 114, 61, 0.20), transparent 62%),
          radial-gradient(860px 660px at 90% 96%, rgba(94, 92, 230, 0.16), transparent 68%),
          linear-gradient(180deg, var(--bg2), var(--bg));
      }

      :root:not([data-theme]) body::before {
        background:
          linear-gradient(115deg, rgba(255, 255, 255, 0.07), rgba(0, 0, 0, 0.18) 42%, rgba(255, 255, 255, 0.04)),
          radial-gradient(760px 520px at 48% 16%, rgba(255, 255, 255, 0.04), transparent 68%);
      }
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    svg {
      display: block;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(var(--page-max), calc(100% - 56px));
      margin: 0 auto;
      padding: 26px 0 24px;
    }

    .view[hidden] {
      display: none !important;
    }

    .liquid {
      position: relative;
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--glass-strong), transparent 12%), color-mix(in srgb, var(--glass), transparent 8%)),
        linear-gradient(180deg, rgba(255,255,255,0.24), rgba(255,255,255,0));
      border: 1px solid var(--edge);
      box-shadow:
        0 28px 80px var(--shadow),
        0 8px 24px var(--shadow-soft),
        inset 0 1px 0 var(--inner-edge),
        inset 0 -1px 0 rgba(0, 0, 0, 0.05);
      -webkit-backdrop-filter: blur(32px) saturate(1.8);
      backdrop-filter: blur(32px) saturate(1.8);
    }

    .liquid::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(120deg, rgba(255,255,255,0.55), rgba(255,255,255,0.08) 32%, transparent 54%),
        linear-gradient(180deg, rgba(255,255,255,0.22), transparent 28%);
      opacity: 0.30;
      mix-blend-mode: screen;
    }

    .top-controls {
      position: absolute;
      top: 16px;
      right: 24px;
      z-index: 45;
      display: flex;
      justify-content: flex-end;
      pointer-events: none;
    }

    .airplay-glyph {
      position: relative;
      width: 25px;
      height: 23px;
    }

    .airplay-glyph::before,
    .airplay-glyph::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 2px solid currentColor;
      border-bottom: 0;
      border-radius: 20px 20px 0 0;
    }

    .airplay-glyph::before {
      top: 2px;
      width: 23px;
      height: 12px;
    }

    .airplay-glyph::after {
      top: 8px;
      width: 15px;
      height: 8px;
    }

    .airplay-glyph span {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 10px solid currentColor;
      transform: translateX(-50%);
    }

    .nav-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: var(--secondary);
      font-size: 14px;
      font-weight: 760;
      white-space: nowrap;
      transition:
        transform 180ms var(--ease-spring),
        background-color 180ms ease,
        color 180ms ease;
    }

    .status-pill.attention {
      color: var(--orange);
      background: transparent;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--green), transparent 84%);
    }

    .status-pill.attention .dot {
      background: var(--orange);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--orange), transparent 84%);
    }

    .theme-switcher {
      display: grid;
      grid-template-columns: repeat(2, 38px);
      gap: 6px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: 0;
    }

    .theme-btn {
      position: relative;
      z-index: 0;
      width: 38px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: transparent;
      color: var(--secondary);
      transition:
        transform 150ms var(--ease-spring),
        color 180ms ease,
        background-color 180ms ease,
        box-shadow 180ms ease;
    }

    .theme-btn svg {
      width: 18px;
      height: 18px;
    }

    .theme-toggle .moon-icon {
      display: none;
    }

    :root[data-resolved-theme="dark"] .theme-toggle .sun-icon {
      display: none;
    }

    :root[data-resolved-theme="dark"] .theme-toggle .moon-icon {
      display: block;
    }

    .theme-btn.active {
      color: var(--label);
      background: transparent;
      box-shadow: none;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(340px, 430px) minmax(0, 1fr);
      align-items: start;
      gap: 26px;
      margin-top: 26px;
    }

    .left-column {
      align-self: start;
      position: sticky;
      top: calc(var(--nav-h) + 42px);
      height: calc(100vh - var(--nav-h) - 94px);
      min-height: 520px;
      display: grid;
      place-items: center;
    }

    .receiver-card,
    .settings-card {
      border-radius: var(--radius-card);
      overflow: hidden;
    }

    .receiver-card {
      width: 100%;
      min-height: min(560px, calc(100vh - var(--nav-h) - 130px));
      padding: 0;
      display: grid;
      place-items: center;
      overflow: visible;
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      transition:
        transform 260ms var(--ease-spring),
        background-color 220ms ease,
        box-shadow 220ms ease;
    }

    .receiver-card::before {
      display: none;
    }

    .receiver-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      min-height: 360px;
      width: 100%;
      padding: 24px;
    }

    .device-object {
      position: relative;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: color-mix(in srgb, var(--label), transparent 8%);
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition:
        transform 260ms var(--ease-spring),
        color 220ms ease,
        opacity 180ms ease;
    }

    .device-object:active {
      transform: scale(0.97);
    }

    .device-object.is-swapping {
      animation: object-pop 280ms var(--ease-spring);
    }

    .receiver-name-field {
      width: min(430px, 100%);
      display: block;
    }

    .receiver-name-input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      border-radius: 22px;
      padding: 9px 16px 10px;
      background: transparent;
      color: var(--label);
      font-size: clamp(30px, 3.3vw, 42px);
      line-height: 1.02;
      font-weight: 880;
      letter-spacing: -0.03em;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      transition:
        background-color 180ms ease,
        box-shadow 180ms ease,
        transform 180ms var(--ease-spring);
    }

    .receiver-name-input:focus {
      background: color-mix(in srgb, var(--glass-heavy), transparent 28%);
      box-shadow:
        inset 0 1px 0 var(--inner-edge),
        0 0 0 4px var(--ring);
    }

    @keyframes object-pop {
      0% { transform: scale(0.95) translateY(7px); opacity: 0.72; }
      64% { transform: scale(1.035) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .obj-speaker {
      position: relative;
      width: 132px;
      height: 172px;
      border-radius: 42px;
      background: linear-gradient(160deg, #555861, #202126 58%, #070708);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.36),
        inset 0 -18px 30px rgba(0,0,0,0.35),
        0 24px 42px rgba(0,0,0,0.22);
    }

    :root[data-theme="dark"] .receiver-visual .obj-speaker {
      background: linear-gradient(160deg, #696D77, #2C2F37 55%, #101114);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.44),
        inset 0 -18px 30px rgba(0,0,0,0.30),
        0 0 0 1px rgba(255,255,255,0.08),
        0 20px 42px rgba(0,0,0,0.38),
        0 0 56px rgba(80, 130, 255, 0.16);
    }

    .obj-speaker::before {
      content: "";

      top: 8px;
      left: 23%;
      right: 23%;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at 50% 50%,
        rgba(4,4,5,0.92) 0 43%,
        rgba(180,184,192,0.62) 45% 63%,
        rgba(255,255,255,0.28) 65% 75%,
        transparent 77%
      );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.48),
        0 2px 7px rgba(0,0,0,0.24);
    }

    :root[data-theme="dark"] .receiver-visual .obj-speaker::before {
      background: radial-gradient(
        ellipse at 50% 50%,
        rgba(5,5,6,0.94) 0 43%,
        rgba(198,202,211,0.70) 45% 64%,
        rgba(255,255,255,0.36) 66% 76%,
        transparent 78%
      );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.58),
        0 2px 8px rgba(0,0,0,0.26);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .receiver-visual .obj-speaker {
        background: linear-gradient(160deg, #696D77, #2C2F37 55%, #101114);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.44),
          inset 0 -18px 30px rgba(0,0,0,0.30),
          0 0 0 1px rgba(255,255,255,0.08),
          0 20px 42px rgba(0,0,0,0.38),
          0 0 56px rgba(80, 130, 255, 0.16);
      }

      :root:not([data-theme]) .receiver-visual .obj-speaker::before {
        background: radial-gradient(
          ellipse at 50% 50%,
          rgba(5,5,6,0.94) 0 43%,
          rgba(198,202,211,0.70) 45% 64%,
          rgba(255,255,255,0.36) 66% 76%,
          transparent 78%
        );
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.58),
          0 2px 8px rgba(0,0,0,0.26);
      }
    }

        inset 0 1px 0 rgba(255,255,255,0.36),

    }

    .obj-speaker.mini::before {
      top: 7px;
      left: 24%;
      right: 24%;
      height: 19px;
      background: radial-gradient(
        ellipse at 50% 50%,
        rgba(4,4,5,0.92) 0 43%,
        rgba(180,184,192,0.62) 45% 63%,
        rgba(255,255,255,0.28) 65% 75%,

    :root[data-theme="dark"] .receiver-visual .obj-speaker.mini {
      background: linear-gradient(160deg, #696D77, #2C2F37 55%, #101114);

        0 20px 42px rgba(0,0,0,0.38),
        0 0 56px rgba(80, 130, 255, 0.16);

    :root[data-theme="dark"] .receiver-visual .obj-speaker.mini::before {
      background: radial-gradient(
        ellipse at 50% 50%,

      );

        inset 0 1px 0 rgba(255,255,255,0.54),

    .obj-speaker.gen1 {
      width: 126px;
      height: 156px;
      border-radius: 48px;
    }

    .obj-airport {
      position: relative;
      width: 190px;
      height: 86px;
      border-radius: 17px;
      background:
        radial-gradient(circle at 72% 64%, rgba(0,0,0,0.82) 0 2px, transparent 2.8px),
        linear-gradient(90deg, rgba(174,181,190,0.30), transparent 10% 90%, rgba(174,181,190,0.26)),
        linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,249,252,0.96) 48%, rgba(229,233,240,0.90));
      border: 1px solid rgba(60, 60, 67, 0.13);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.95),
        inset 0 -2px 0 rgba(0,0,0,0.15),
        0 26px 38px rgba(31,35,46,0.18);
    }

    .obj-airport::before {
      content: "";
      position: absolute;
      left: 13px;
      right: 13px;
      top: 8px;
      height: 36px;
      border-radius: 50% / 48%;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(214,218,226,0.24), transparent 36%),
        linear-gradient(180deg, rgba(255,255,255,0.80), rgba(255,255,255,0.34) 50%, rgba(255,255,255,0.08) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.92),
        0 14px 24px rgba(31,35,46,0.06);
    }

    .obj-airport::after {
      content: "";
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: -10px;
      height: 14px;
      border-radius: 50%;
      background: rgba(0,0,0,0.18);
      filter: blur(10px);
    }

    .obj-generic {
      position: relative;
      width: 132px;
      height: 174px;
      border-radius: 34px;
      background:
        radial-gradient(circle at 50% 31%, #202229 0 23px, #747984 24px 27px, transparent 28px),
        radial-gradient(circle at 50% 70%, #17191E 0 36px, #6E737E 37px 41px, transparent 42px),
        linear-gradient(155deg, #F8FAFD, #D7DCE5 54%, #AEB5C2);
      border: 1px solid rgba(68, 73, 84, 0.20);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.92),
        inset 0 -16px 28px rgba(72,78,90,0.18),

      color: var(--label);
      background: color-mix(in srgb, var(--glass-heavy), transparent 2%);
      border: 1px solid color-mix(in srgb, var(--edge), transparent 28%);
      box-shadow: 0 10px 24px var(--shadow-soft), inset 0 1px 0 var(--inner-edge);
      -webkit-backdrop-filter: blur(24px) saturate(1.55);
      backdrop-filter: blur(24px) saturate(1.55);
      font-size: 12px;
      font-weight: 760;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease, transform 160ms var(--ease-spring);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .btn.primary {
      color: #fff;
      background: linear-gradient(180deg, #0A84FF, #007AFF);
      box-shadow: 0 12px 28px color-mix(in srgb, var(--blue), transparent 68%);
    }

    .bounce {
      animation: bounce-tap 260ms var(--ease-spring);
    }

    @keyframes bounce-tap {
      0% { transform: scale(0.97); }
      62% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @media (hover: hover) and (pointer: fine) {
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 4px solid var(--ring);
        outline-offset: 3px;
      }

      .btn.icon-only:hover::after,
      .btn.icon-only:focus-visible::after {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .theme-btn:active,
    .model-card:active,
    .btn:active,
    .row:active {
      transform: scale(0.97);
    }

    @media (prefers-reduced-transparency: reduce) {
      body,
      body::before {
        background: var(--bg);
      }

      .liquid,
      .btn {
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        background: var(--glass-heavy);
      }
    }

    @media (prefers-contrast: more) {
      :root {
        --separator: currentColor;
        --edge: color-mix(in srgb, var(--label), transparent 45%);
        --glass: color-mix(in srgb, var(--bg), var(--label) 6%);
        --glass-strong: color-mix(in srgb, var(--bg), var(--label) 9%);
        --glass-heavy: color-mix(in srgb, var(--bg), var(--label) 12%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }

    @media (max-width: 1019px) {
      .app {
        width: min(640px, calc(100% - 32px));
      }

      .layout {
        display: contents;
      }

      .left-column {
        position: static;
        margin-top: 24px;
        height: auto;
        min-height: 220px;
        margin-bottom: 16px;
        place-items: center;
      }

      .settings {
        margin-top: 0;
      }

      .receiver-visual {
        align-items: center;
        padding: 24px;
      }

      .receiver-name-input {
        text-align: center;
      }

      .action-align {
        justify-content: flex-end;
      }
    }

    @media (max-width: 599px) {
      :root {
        --nav-h: 58px;
      }

      .app {
        width: 100%;
        padding: 12px 12px 24px;
      }

      .top-controls {
        top: 8px;
        right: 10px;
      }

      .status-pill {
        min-height: 34px;
        padding: 0;
      }

      .status-pill .status-copy {
        display: none;
      }

      .theme-switcher {
        grid-template-columns: repeat(2, 34px);
        gap: 4px;
        padding: 0;
      }

      .theme-btn {
        width: 34px;
        height: 31px;
      }

      .receiver-card,
      .settings-card {
        padding: 18px;
      }

      .receiver-card {
        min-height: 220px;
      }

      .receiver-visual {
        min-height: 200px;
        padding: 2px;
        gap: 22px;
      }

      .receiver-name-input {
        font-size: 32px;
        padding-inline: 10px;
      }

      .obj-airport {
        width: 152px;
        height: 70px;
        border-radius: 13.5px;
      }

      .obj-generic {
        width: 106px;
        height: 138px;
        border-radius: 28px;
      }

      .obj-speaker,
      .obj-speaker.gen1 {
        width: 106px;
        height: 136px;
      }

      .obj-speaker.mini {
        width: 126px;
        height: 112px;
      }

      .obj-tv {
        width: 142px;
        height: 92px;
      }

      .model-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .model-card {
        min-height: 112px;
      }

      .row {
        min-height: 56px;
        gap: 10px;
        padding: 9px 12px;
      }

      .row-control {
        max-width: 68%;
      }

      .range-wrap {
        width: 190px;
      }

      .db-list {
        padding: 9px;
      }

      .db-control {
        padding: 12px;
      }

      .db-adjuster {
        grid-template-columns: 36px minmax(0, 1fr) 36px;
        gap: 9px;
      }

      .db-step {
        width: 36px;
        height: 36px;
      }

      .advanced-dialog {
        width: calc(100% - 16px);
        max-height: calc(100dvh - 16px);
        margin: auto auto 8px;
        border-radius: 26px 26px 20px 20px;
      }

      .advanced-dialog-content {
        max-height: calc(100dvh - 16px);
        padding: 20px 18px calc(18px + env(safe-area-inset-bottom));
      }

      .advanced-dialog textarea {
        min-height: 42dvh;
      }

      .action-align {
        width: calc(100% - 20px);
        margin: 0 auto;
      }

      .toolbar {
        display: flex;
        justify-content: flex-end;
        gap: 7px;
        padding: 0;
      }

      .btn {
        min-height: 40px;
        padding: 0 10px;
      }

      .btn.icon-only {
        width: 40px;
      }

    }
  </style>
</head>
<body>
  <div class="top-controls" id="topControls">
    <div class="nav-actions">
      <div class="status-pill" id="statusPill"><span class="dot"></span><span class="status-copy" id="statusShort">读取中</span></div>
      <div class="theme-switcher" aria-label="外观模式">
        <button class="theme-btn theme-toggle" id="themeToggle" type="button" title="切换深色模式" aria-label="切换深色模式">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.9 14.46A8.5 8.5 0 0 1 9.54 3.1a.9.9 0 0 0-1.07-1.2 10.25 10.25 0 1 0 13.63 13.63.9.9 0 0 0-1.2-1.07Z"></path>
          </svg>
        </button>
        <button class="theme-btn" type="button" data-theme-choice="system" title="跟随系统" aria-label="跟随系统">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="13" rx="3"></rect><path d="M8 21h8M12 17v4"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <main class="app">
    <section class="view layout" id="configView">
      <aside class="left-column">
        <section class="receiver-card" id="receiverCard" aria-label="当前设备图标">
          <div class="receiver-visual">
            <button class="device-object" id="deviceObject" title="重启" aria-label="重启 AirPlay 接收端" type="button"></button>
            <label class="receiver-name-field">
              <span class="sr-only">设备名称</span>
              <input class="receiver-name-input" id="name" maxlength="50" autocomplete="off" aria-label="设备名称">
            </label>
          </div>
        </section>
      </aside>

      <section class="settings">
        <section class="settings-card liquid">
          <div class="card-head">
            <h3>AirPlay 图标</h3>
            <span>机型标识</span>
          </div>
          <div class="model-grid" id="modelGrid"></div>
        </section>

        <section class="settings-card liquid">
          <div class="card-head"><h3>音频</h3><span>ALSA 输出</span></div>
          <div class="form-list">
            <label class="row select-row">
              <span class="row-label">输出设备</span>
              <span class="row-control"><span class="select-value" id="audioValue">default</span><span class="chevron"></span></span>
              <select class="native-select" id="audio_device"></select>
            </label>
            <label class="row select-row">
              <span class="row-label">硬件音量</span>
              <span class="row-control"><span class="select-value" id="mixerValue">不使用</span><span class="chevron"></span></span>
              <select class="native-select" id="mixer_control_name"></select>
            </label>
            <div class="row">
              <span class="row-label">音量</span>
              <span class="row-control">
                <span class="range-wrap">
                  <input type="range" min="0" max="100" step="1" id="volume_percent">
                  <span class="range-value" id="volumeValue">70%</span>
                </span>
              </span>
            </div>
            <label class="row">
              <span class="row-label">忽略 iOS 音量</span>
              <span class="row-control">
                <span class="switch">
                  <input type="checkbox" id="ignore_volume_control">
                  <span class="switch-track"></span>
                </span>
              </span>
            </label>
          </div>
          <p class="note">USB DAC 会显示为 ALSA 播放设备；HDMI 音频只有在 HDMI 端真正接入显示器、功放或采集设备后才会出现。</p>
        </section>

        <section class="settings-card liquid">
          <div class="card-head"><h3>高级</h3><span>安全边界</span></div>
          <div class="form-list db-list">
            <div class="db-control">
              <div class="db-meta"><span>音量范围</span><strong id="volumeRangeDbValue">60 dB</strong></div>
              <div class="db-adjuster">
                <button class="db-step" type="button" data-db-target="volume_range_db" data-db-dir="-1" aria-label="减小音量范围">-</button>
                <input class="db-range" type="range" min="30" max="150" step="1" id="volume_range_db" data-db-value="volumeRangeDbValue" aria-label="音量范围 dB">
                <button class="db-step" type="button" data-db-target="volume_range_db" data-db-dir="1" aria-label="增大音量范围">+</button>
              </div>
            </div>
            <div class="db-control">
              <div class="db-meta"><span>最大音量</span><strong id="volumeMaxDbValue">0 dB</strong></div>
              <div class="db-adjuster">
                <button class="db-step" type="button" data-db-target="volume_max_db" data-db-dir="-1" aria-label="降低最大音量">-</button>
                <input class="db-range" type="range" min="-60" max="0" step="0.5" id="volume_max_db" data-db-value="volumeMaxDbValue" aria-label="最大音量 dB">
                <button class="db-step" type="button" data-db-target="volume_max_db" data-db-dir="1" aria-label="提高最大音量">+</button>
              </div>
            </div>
          </div>
          <p class="note">保存时自动限制为合法范围：音量范围 30–150 dB，最大音量不高于 0 dB。</p>
          <div class="advanced-settings-launch">
            <button class="advanced-settings-button" id="advancedSettingsBtn" type="button">
              <span>高级设置</span>
              <span class="advanced-settings-trailing">
                <span id="additionalConfigStatus">未设置</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
              </span>
            </button>
          </div>
        </section>

        <div class="save-apply-launch" id="saveAction" hidden>
          <button class="save-apply-button" id="saveBtn" type="button">保存重启</button>
        </div>

      </section>
    </section>
  </main>

  <dialog class="advanced-dialog liquid" id="advancedDialog" aria-labelledby="advancedDialogTitle">
    <div class="advanced-dialog-content">
      <div class="advanced-dialog-head">
        <h3 id="advancedDialogTitle">高级设置</h3>
        <button class="advanced-dialog-close" id="advancedCloseBtn" type="button" title="关闭" aria-label="关闭高级设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>
      <label for="additional_config">自定义配置</label>
      <textarea id="additional_config" spellcheck="false" placeholder="输入合法的 libconfig 配置段"></textarea>
      <p class="note">内容会原样追加到配置文件末尾。配置格式错误可能导致接收端无法启动。</p>
      <div class="advanced-dialog-actions">
        <button class="advanced-dialog-done" id="advancedDoneBtn" type="button">完成</button>
      </div>
    </div>
  </dialog>

  <div class="action-shell">
    <div class="version-badge" id="versionBadge" aria-label="当前版本">V 5.2.2</div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const api = async (path, options = {}) => {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        cache: "no-store",
        ...options
      });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    };

    const THEME_KEY = "airplay-panel-theme";
    const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
    let currentState = null;
    let selectedModel = "AirPort10,115";
    let themePreference = localStorage.getItem(THEME_KEY) || "system";
    let volumeApplyTimer = null;
    let savedSettingsSnapshot = null;

    const modelMeta = {
      ShairportSync: {
        short: "扬声器",
        sub: "",
        kind: "generic",
        object: '<div class="obj-generic"></div>',
        tile: '<span class="tile-device tile-generic"></span>'
      },
      "AirPort10,115": {
        short: "AirPort",
        sub: "",
        kind: "airport",
        object: '<div class="obj-airport"></div>',
        tile: '<span class="tile-device tile-airport"></span>'
      },
      "AudioAccessory5,1": {
        short: "mini",
        sub: "HomePod",
        kind: "mini",
        object: '<div class="obj-speaker mini"></div>',
        tile: '<span class="tile-device tile-homepod tile-mini"></span>'
      },
      "AudioAccessory1,2": {
        short: "一代",
        sub: "HomePod",
        kind: "gen1",
        object: '<div class="obj-speaker gen1"></div>',
        tile: '<span class="tile-device tile-homepod tile-gen1"></span>'
      },
      "AudioAccessory6,1": {
        short: "二代",
        sub: "HomePod",
        kind: "gen2",
        object: '<div class="obj-speaker"></div>',
        tile: '<span class="tile-device tile-homepod tile-gen2"></span>'
      },
      "AppleTV6,2": {
        short: "TV 4K",
        sub: "Apple TV",
        kind: "tv",
        object: '<div class="obj-tv"></div>',
        tile: '<span class="tile-device tile-tv"></span>'
      }
    };

    function bounce(el) {
      if (!el) return;
      el.classList.remove("bounce");
      void el.offsetWidth;
      el.classList.add("bounce");
    }

    function setTheme(choice, announce = false) {
      themePreference = ["light", "dark", "system"].includes(choice) ? choice : "system";
      localStorage.setItem(THEME_KEY, themePreference);
      document.documentElement.dataset.themePreference = themePreference;
      if (themePreference === "light" || themePreference === "dark") {
        document.documentElement.dataset.theme = themePreference;
      } else {
        document.documentElement.removeAttribute("data-theme");
      }
      const resolvedTheme = themePreference === "system"
        ? (systemTheme.matches ? "dark" : "light")
        : themePreference;
      document.documentElement.dataset.resolvedTheme = resolvedTheme;
      const themeToggle = $("themeToggle");
      const nextThemeLabel = resolvedTheme === "dark" ? "切换浅色模式" : "切换深色模式";
      themeToggle.title = nextThemeLabel;
      themeToggle.setAttribute("aria-label", nextThemeLabel);
      themeToggle.classList.toggle("active", themePreference !== "system");
      themeToggle.setAttribute("aria-pressed", themePreference !== "system" ? "true" : "false");
      document.querySelectorAll("[data-theme-choice]").forEach((button) => {
        const active = button.dataset.themeChoice === themePreference;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", active ? "true" : "false");
      });
      if (announce) {
        const labels = { light: "浅色模式", dark: "深色模式", system: "跟随系统" };
        setStatus(`外观已切换为${labels[themePreference]}`);
      }
    }

    function setStatus(text, ok = true) {
      $("statusShort").textContent = ok ? "就绪" : "注意";
      $("statusPill").classList.toggle("attention", !ok);
      bounce($("statusPill"));
    }

    function optionLabel(select, value) {
      const found = [...select.options].find((option) => option.value === value);
      return found ? found.textContent : (value || "未选择");
    }

    function setText(id, value) {
      const element = $(id);
      if (element) element.textContent = value;
    }

    function updateRangeFill() {
      const range = $("volume_percent");
      const value = Number(range.value || 0);
      range.style.setProperty("--range-fill", `${value}%`);
      $("volumeValue").textContent = `${value}%`;
    }

    function clampNumber(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function formatDbValue(value) {
      const rounded = Math.round(value * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    function updateDbControl(input) {
      if (!input) return;
      const min = Number(input.min || 0);
      const max = Number(input.max || 100);
      const raw = Number(input.value || min);
      const value = Number.isFinite(raw) ? clampNumber(raw, min, max) : min;
      const percent = max === min ? 0 : ((value - min) / (max - min)) * 100;
      input.style.setProperty("--range-fill", `${clampNumber(percent, 0, 100)}%`);
      const label = $(input.dataset.dbValue);
      if (label) label.textContent = `${formatDbValue(value)} dB`;
    }

    function updateDbControls() {
      updateDbControl($("volume_range_db"));
      updateDbControl($("volume_max_db"));
    }

    function stepDbControl(button) {
      const input = $(button.dataset.dbTarget);
      if (!input) return;
      const direction = Number(button.dataset.dbDir || 0);
      const stepText = input.getAttribute("step") || "1";
      const step = Number(stepText);
      const decimals = stepText.includes(".") ? stepText.split(".")[1].length : 0;
      const min = Number(input.min || 0);
      const max = Number(input.max || 100);
      const current = Number(input.value || min);
      const next = clampNumber(current + (direction * step), min, max);
      input.value = next.toFixed(decimals);
      updateDbControl(input);
      input.dispatchEvent(new Event("input", { bubbles: true }));
      setStatus("高级音量已修改，保存并重启后生效");
    }

    function formSettings() {
      return {
        name: $("name").value,
        model: selectedModel,
        audio_device: $("audio_device").value,
        mixer_control_name: $("mixer_control_name").value,
        volume_percent: Number($("volume_percent").value),
        volume_range_db: Number($("volume_range_db").value),
        volume_max_db: Number($("volume_max_db").value),
        ignore_volume_control: $("ignore_volume_control").checked ? "yes" : "no",
        equalizer_enabled: "no",
        equalizer_preset: "flat",
        equalizer_bands: {},
        additional_config: $("additional_config").value
      };
    }

    function realtimeVolumeSettings() {
      return {
        audio_device: $("audio_device").value,
        mixer_control_name: $("mixer_control_name").value,
        volume_percent: Number($("volume_percent").value)
      };
    }

    function comparableSettings(settings) {
      return {
        name: String(settings.name ?? ""),
        model: String(settings.model ?? ""),
        audio_device: String(settings.audio_device ?? ""),
        mixer_control_name: String(settings.mixer_control_name ?? ""),
        volume_percent: Number(settings.volume_percent),
        volume_range_db: Number(settings.volume_range_db),
        volume_max_db: Number(settings.volume_max_db),
        ignore_volume_control: settings.ignore_volume_control === "yes" ? "yes" : "no",
        additional_config: String(settings.additional_config ?? "")
      };
    }

    function settingsSnapshot(settings = formSettings()) {
      return JSON.stringify(comparableSettings(settings));
    }

    function updateSaveButtonVisibility() {
      const hasChanges = savedSettingsSnapshot !== null && settingsSnapshot() !== savedSettingsSnapshot;
      $("saveAction").hidden = !hasChanges;
    }

    function markCurrentSettingsSaved() {
      savedSettingsSnapshot = settingsSnapshot();
      updateSaveButtonVisibility();
    }

    function renderModelCards(models) {
      const grid = $("modelGrid");
      grid.innerHTML = "";
      models.forEach((model) => {
        const meta = modelMeta[model.id] || {
          short: model.label,
          sub: model.detail || model.id,
          kind: "generic",
          object: modelMeta.ShairportSync.object,
          tile: modelMeta.ShairportSync.tile
        };
        const button = document.createElement("button");
        button.type = "button";
        button.className = `model-card${model.id === selectedModel ? " active" : ""}`;
        button.dataset.model = model.id;
        button.title = `${model.label} · ${model.id}`;

        const icon = document.createElement("span");
        icon.className = "model-icon";
        icon.innerHTML = meta.tile || modelMeta.ShairportSync.tile;

        const title = document.createElement("span");
        title.className = "model-title";
        title.textContent = meta.short;

        const detail = document.createElement("span");
        detail.className = "model-detail";
        detail.textContent = meta.sub;

        button.append(icon);
        if (meta.short) button.append(title);
        if (meta.sub) button.append(detail);
        button.addEventListener("click", () => {
          selectedModel = model.id;
          renderModelCards(currentState.models);
          updateSummaries(true);
          bounce(button);
          setStatus(`已选择 ${model.id}，保存后生效`);
        });
        grid.appendChild(button);
      });
    }

    function renderSelect(select, options, value, emptyLabel) {
      select.innerHTML = "";
      if (emptyLabel) {
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = emptyLabel;
        select.appendChild(empty);
      }
      options.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.id || item.name || item;
        option.textContent = item.label || item.name || item;
        select.appendChild(option);
      });
      if (value && ![...select.options].some((option) => option.value === value)) {
        const current = document.createElement("option");
        current.value = value;
        current.textContent = value;
        select.appendChild(current);
      }
      select.value = value || "";
    }

    function renderWarnings(warnings) {
      void warnings;
    }

    function updateDeviceVisual(animate = false) {
      const meta = modelMeta[selectedModel] || modelMeta.ShairportSync;
      const visualKey = meta.kind || selectedModel || "generic";
      const object = $("deviceObject");
      if (object.dataset.kind !== visualKey || !object.innerHTML) {
        object.innerHTML = meta.object || modelMeta.ShairportSync.object;
        object.dataset.kind = visualKey;
        if (animate) {
          object.classList.remove("is-swapping");
          void object.offsetWidth;
          object.classList.add("is-swapping");
        }
      }
      $("receiverCard").dataset.modelKind = visualKey;
    }

    function updateAdditionalConfigStatus() {
      const hasConfig = $("additional_config").value.trim().length > 0;
      setText("additionalConfigStatus", hasConfig ? "已设置" : "未设置");
    }

    function openAdvancedSettings() {
      const dialog = $("advancedDialog");
      if (!dialog.open) dialog.showModal();
      requestAnimationFrame(() => $("additional_config").focus());
    }

    function closeAdvancedSettings() {
      const dialog = $("advancedDialog");
      if (dialog.open) dialog.close();
      updateAdditionalConfigStatus();
    }

    function updateSummaries(animateModel = false) {
      const model = (currentState?.models || []).find((item) => item.id === selectedModel);
      setText("receiverModel", model ? `${model.label} · ${model.id}` : selectedModel);
      setText("modelSummary", model ? `${model.label} · ${model.id}` : selectedModel);
      setText("audioSummary", optionLabel($("audio_device"), $("audio_device").value));
      setText("mixerSummary", optionLabel($("mixer_control_name"), $("mixer_control_name").value) || "不使用");
      setText("audioValue", optionLabel($("audio_device"), $("audio_device").value));
      setText("mixerValue", optionLabel($("mixer_control_name"), $("mixer_control_name").value) || "不使用");
      updateAdditionalConfigStatus();
      updateDeviceVisual(animateModel);
      updateSaveButtonVisibility();
      if (animateModel && $("receiverModel")) {
        $("receiverModel").classList.remove("is-swapping");
        void $("receiverModel").offsetWidth;
        $("receiverModel").classList.add("is-swapping");
      }
    }

    async function refreshState() {
      savedSettingsSnapshot = null;
      updateSaveButtonVisibility();
      currentState = await api("/api/state");
      const settings = currentState.settings;
      selectedModel = settings.model;

      $("name").value = settings.name;
      $("volume_percent").value = settings.volume_percent;
      $("volume_range_db").value = settings.volume_range_db;
      $("volume_max_db").value = settings.volume_max_db;
      $("ignore_volume_control").checked = settings.ignore_volume_control === "yes";
      $("additional_config").value = settings.additional_config || "";

      renderSelect($("audio_device"), currentState.audio_devices, settings.audio_device);
      renderSelect($("mixer_control_name"), currentState.mixer_controls, settings.mixer_control_name, "不使用");
      renderModelCards(currentState.models);
      renderWarnings(currentState.warnings);

      setText("versionBadge", `V ${currentState.version || "5.2.2"}`);
      updateRangeFill();
      updateDbControls();
      updateSummaries();
      markCurrentSettingsSaved();
      setStatus("已读取当前配置");
    }

    async function refreshMixers() {
      const result = await api(`/api/mixers?device=${encodeURIComponent($("audio_device").value)}`);
      renderSelect($("mixer_control_name"), result.mixer_controls, "", "不使用");
      updateSummaries();
    }

    async function saveAndRestart() {
      setStatus("正在保存并重启");
      const result = await api("/api/save", {
        method: "POST",
        body: JSON.stringify({ ...formSettings(), restart: true })
      });
      renderWarnings(result.warnings);
      markCurrentSettingsSaved();
      setStatus(result.restart?.ok ? "已保存并重启" : "已保存，重启失败", Boolean(result.restart?.ok));
    }

    async function restartOnly() {
      setStatus("正在重启接收端");
      const result = await api("/api/restart", { method: "POST", body: "{}" });
      setStatus(result.ok ? "接收端已重启" : `重启失败：${result.error || "未知错误"}`, Boolean(result.ok));
    }

    async function applyVolume({ silentNoMixer = true } = {}) {
      updateRangeFill();
      if (!$("mixer_control_name").value) {
        if (!silentNoMixer) setStatus("选择硬件音量控件后可实时应用", false);
        return;
      }
      const result = await api("/api/volume", {
        method: "POST",
        body: JSON.stringify(realtimeVolumeSettings())
      });
      setStatus(result.ok ? "硬件音量已更新" : `音量未应用：${result.error || "检查 Mixer 控件"}`, Boolean(result.ok));
    }

    function scheduleApplyVolume() {
      updateRangeFill();
      if (volumeApplyTimer) clearTimeout(volumeApplyTimer);
      volumeApplyTimer = setTimeout(() => {
        applyVolume().catch((error) => setStatus(`音量未应用：${error.message}`, false));
      }, 120);
    }

    function bindEvents() {
      $("themeToggle").addEventListener("click", () => {
        const currentTheme = document.documentElement.dataset.resolvedTheme || "light";
        setTheme(currentTheme === "dark" ? "light" : "dark", true);
        bounce($("themeToggle"));
      });
      document.querySelectorAll("[data-theme-choice]").forEach((button) => {
        button.addEventListener("click", () => {
          setTheme(button.dataset.themeChoice, true);
          bounce(button);
        });
      });
      systemTheme.addEventListener("change", () => {
        if (themePreference === "system") setTheme("system");
      });
      ["name", "audio_device", "mixer_control_name", "volume_percent", "volume_range_db", "volume_max_db", "ignore_volume_control", "additional_config"].forEach((id) => {
        $(id).addEventListener("input", () => updateSummaries());
        $(id).addEventListener("change", () => updateSummaries());
      });
      $("name").addEventListener("input", () => setStatus("名称已修改，保存后生效"));
      $("audio_device").addEventListener("change", refreshMixers);
      $("volume_percent").addEventListener("input", scheduleApplyVolume);
      $("volume_percent").addEventListener("change", () => applyVolume({ silentNoMixer: false }));
      ["volume_range_db", "volume_max_db"].forEach((id) => {
        $(id).addEventListener("input", () => {
          updateDbControls();
          setStatus("高级音量已修改，保存并重启后生效");
        });
        $(id).addEventListener("change", () => setStatus("高级音量已修改，保存并重启后生效"));
      });
      document.querySelectorAll(".db-step").forEach((button) => {
        button.addEventListener("click", () => {
          bounce(button);
          stepDbControl(button);
        });
      });
      $("advancedSettingsBtn").addEventListener("click", () => {
        bounce($("advancedSettingsBtn"));
        openAdvancedSettings();
      });
      $("advancedCloseBtn").addEventListener("click", closeAdvancedSettings);
      $("advancedDoneBtn").addEventListener("click", closeAdvancedSettings);
      $("advancedDialog").addEventListener("cancel", (event) => {
        event.preventDefault();
        closeAdvancedSettings();
      });
      $("advancedDialog").addEventListener("click", (event) => {
        if (event.target === $("advancedDialog")) closeAdvancedSettings();
      });
      $("saveBtn").addEventListener("click", () => { bounce($("saveBtn")); saveAndRestart(); });
      $("deviceObject").addEventListener("click", () => { bounce($("deviceObject")); restartOnly(); });
    }

    setTheme(themePreference);
    bindEvents();
    updateDeviceVisual();
    refreshState().catch((error) => {
      currentState = { models: Object.keys(modelMeta).map((id) => ({ id, label: modelMeta[id].short })) };
      renderModelCards(currentState.models);
      renderWarnings([]);
      updateRangeFill();
      updateDbControls();
      updateSummaries();
      markCurrentSettingsSaved();
      setStatus(`读取失败：${error.message}`, false);
    });
  </script>
</body>
</html>
