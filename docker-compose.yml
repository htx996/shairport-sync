name: shairport-sync-panel

services:
  shairport-sync:
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        SHAIRPORT_SYNC_REF: master
        NQPTP_REF: main
        RAOP_AM_MODEL: ""
    image: local/shairport-sync-airplay2:latest
    container_name: shairport-sync
    platform: linux/amd64
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ./config:/config
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    logging:
      options:
        max-size: "500k"
        max-file: "5"

  webui:
    build:
      context: ./webui
    image: local/shairport-sync-webui:latest
    container_name: shairport-sync-webui
    platform: linux/amd64
    network_mode: host
    restart: unless-stopped
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ./config:/config
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SHAIRPORT_CONTAINER: shairport-sync
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: "8099"
      # PANEL_USER: admin
      # PANEL_PASSWORD: "change-me"
    depends_on:
      - shairport-sync
